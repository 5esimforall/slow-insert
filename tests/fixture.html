<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Slow Insert — browser test fixture</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/module/styles/slow-insert.css">
<link rel="stylesheet" href="/truesight/styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #242b2b; color: #d8dfde; font: 14px system-ui; }
  .fixture { padding: 32px; max-width: 470px; }
  h1 { font-size: 24px; font-weight: 500; }
  p { color: #a2aeac; line-height: 1.6; }
  #sidebar { position: fixed; right: 0; top: 0; width: min(360px, 100vw); height: 100vh; display: flex; flex-direction: column; background: #12171dd9; border-left: 1px solid #3b4248; padding: 0; }
  #sidebar.collapsed { width: 48px; }
  #sidebar [role=tablist] { display: flex; flex: none; overflow: hidden; }
  .sidebar-content { flex: 1; min-height: 0; display: flex; }
  .sidebar-content > .tab { display: none; flex: 1; min-width: 0; }
  .sidebar-content > .tab.active { display: flex; }
  .fixture-window.slow-insert-sidebar .window-content { display: flex; min-height: 0; }
  #sidebar.collapsed .sidebar-content { display: none; }
  #drop { border: 1px dashed #758d84; padding: 28px; margin-top: 32px; }
  button { cursor: pointer; }
  .fixture-window { position: fixed; z-index: 100; display: flex; flex-direction: column; background: #eeecef; color: #302b35; box-shadow: 0 6px 20px #0008; }
  .fixture-window > header { display: flex; justify-content: space-between; padding: 10px; }
  .fixture-window .window-content { overflow: auto; flex: 1; }
</style>
<main class="fixture">
  <h1>Slow Insert / test scene</h1>
  <p>Browser fixture, not a live Foundry world. Search “fire” to compare source badges. Search “unsafe” to exercise text escaping.</p>
  <button id="collapse">Toggle sidebar</button>
  <button id="popout">Pop out search tab</button>
  <button id="rerender">Re-render search tab</button>
  <button id="run-checks">Run browser checks</button>
  <pre id="check-report" aria-live="polite"></pre>
  <button id="deny">Toggle GM-only restriction</button>
  <div id="drop">Drop an item here</div>
  <p id="opened">No document opened.</p>
</main>
<aside id="sidebar"><nav role="tablist" aria-label="Sidebar tabs"></nav><div class="sidebar-content"><section class="tab active" data-tab="chat">Chat placeholder</section></div></aside>
<script type="module">
  const language = new URL(location.href).searchParams.get("lang") || "en";
  const fallback = await (await fetch("/module/lang/en.json")).json();
  const translations = language === "cn" ? await (await fetch("/module/lang/cn.json")).json() : {};
  const systemLabels = language === "cn"
    ? { "TYPES.Item.spell": "法术", "TYPES.Item.weapon": "武器" }
    : { "TYPES.Item.spell": "Spell", "TYPES.Item.weapon": "Weapon" };
  document.documentElement.lang = language === "cn" ? "zh-CN" : language;
  const foundationLabels = await (await fetch(`/truesight/lang/${language === "cn" ? "cn" : "en"}.json`)).json();
  const labels = { ...fallback, ...translations, ...systemLabels, ...foundationLabels };
  const handlers = new Map();
  globalThis.Hooks = {
    on(name, fn) { const list = handlers.get(name) || []; list.push(fn); handlers.set(name, list); return fn; },
    once(name, fn) { const once = (...args) => { this.off(name, once); return fn(...args); }; return this.on(name, once); },
    off(name, fn) { handlers.set(name, (handlers.get(name) || []).filter(x => x !== fn)); },
    callAll(name, ...args) { return Promise.all([...(handlers.get(name) || [])].map(fn => fn(...args))); }
  };
  const definitions = new Map();
  const settings = new Map([["dnd5e.rulesVersion", "modern"], ["quick-insert.gmOnly", false], ["quick-insert.automaticIndexing", -1], ...Object.entries(globalThis.fixtureSettingsSeed ?? {})]);
  const icon = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><rect width="32" height="32" rx="5" fill="#774f3a"/><path d="M16 5c7 10 10 12 6 19-3 5-13 3-13-3 0-5 6-6 7-16z" fill="#efb478"/></svg>');
  globalThis.fixtureState = { calls: [], opened: [], indexBuilds: 0, denied: false };
  globalThis.game = {
    system: { id: "dnd5e" }, world: {id:"fixture"}, user: { id:"fixture-user", isGM: false, can(permission) { return this.isGM && permission === "SETTINGS_MODIFY"; } },
    modules: new Map([["quick-insert", { active: true }], ["truesight", {active:true}], ["slow-insert", await (await fetch("/module/module.json")).json()]]),
    packs: new Map([["fixture.spells", { visible: true, title: "Example spells", metadata: { packageType: "module", packageName: "fixture" } }]]),
    settings: {
      registerMenu() {},
      storage: new Map([["client", {getItem: key => settings.has(key) ? JSON.stringify(settings.get(key)) : null}]]),
      register(id, key, config) { definitions.set(`${id}.${key}`, config); if (!settings.has(`${id}.${key}`)) settings.set(`${id}.${key}`, config.default); },
      get(id, key) { return settings.get(`${id}.${key}`); },
      async set(id, key, value) { settings.set(`${id}.${key}`, value); definitions.get(`${id}.${key}`)?.onChange?.(value); return value; }
    },
    keybindings: { actions: new Map(), register(id, key, config) {
      this.actions.set(`${id}.${key}`, config);
      if (key === "toggle") fixtureState.keybind = config;
    } },
    i18n: { lang: language, localize: key => labels[key] || key }
  };
  // Single-client socket contract for Truesight startup; no server or peer delivery.
  const socketHandlers = new Map();
  game.socket = {
    id: "fixture-session", connected: true,
    on(name, fn) { const listeners = socketHandlers.get(name) ?? new Set(); listeners.add(fn); socketHandlers.set(name, listeners); },
    off(name, fn) { socketHandlers.get(name)?.delete(fn); },
    emit() {}
  };
  fixtureState.reconnect = () => { for (const fn of socketHandlers.get("connect") ?? []) fn(); };
  game.users = new Map([[game.user.id, game.user]]);
  Object.defineProperty(game.users, "activeGM", { get: () => game.user.isGM ? game.user : null });
  globalThis.ui = { windows: {}, notifications: { warn: message => { fixtureState.warning = message; } } };
  globalThis.CONFIG = { Item: { compendiumIndexFields: [], typeLabels: { spell: "TYPES.Item.spell", weapon: "TYPES.Item.weapon" } }, Actor: { compendiumIndexFields: [], typeLabels: { npc: "怪物" } } };
  globalThis.CONST = { KEYBINDING_PRECEDENCE: { PRIORITY: 0, NORMAL: 1, DEFERRED: 2 } };
  globalThis.foundry = { applications: { instances: new Map() } };
  // Minimal native-frame stand-in. Production behavior is verified in Foundry.
  class FixtureApplication {
    static DEFAULT_OPTIONS = {};
    constructor(options={}) {this.options={...this.constructor.DEFAULT_OPTIONS,...options};this.position={...this.constructor.DEFAULT_OPTIONS.position,...options.position};this.id=options.id??crypto.randomUUID();this.hasFrame=true;}
    async render(options={}) {
      const first=!this.rendered;
      if(first){this.element=document.createElement('section');this.element.className=(this.constructor.DEFAULT_OPTIONS.classes??[]).join(' ');this.element.classList.add('fixture-window');
        const header=document.createElement('header'),title=document.createElement('strong'),close=document.createElement('button');
        title.className='window-title';title.textContent=this.options.window?.title??'';close.textContent='×';close.setAttribute('aria-label','Close window');close.onclick=()=>this.close();header.append(title,close);this.element.append(header);
        this.content=document.createElement('div');this.content.className='window-content';this.element.append(this.content);document.body.append(this.element);foundry.applications.instances.set(this.id,this);}
      if(options.window?.title) this.element.querySelector(".window-title").textContent=options.window.title;
      Object.assign(this.position,options.position);Object.assign(this.element.style,{left:`${this.position.left??20}px`,top:`${this.position.top??20}px`,width:`${this.position.width??620}px`,height:`${this.position.height??650}px`});
      this._replaceHTML(await this._renderHTML(),this.content);this.rendered=true;await this._onRender({}, {isFirstRender:first});return this;
    }
    _onRender(){} _onPosition(){} _onClose(){}
    async close(options={}){this.rendered=false;this.element?.remove();foundry.applications.instances.delete(this.id);await this._onClose(options);}
    bringToFront(){this.element?.focus();}
  }
  foundry.applications.api={ApplicationV2:FixtureApplication};
  const { installSidebarFixture, mountSidebarFixture } = await import("./sidebar-fixture.mjs");
  installSidebarFixture(FixtureApplication);
  // Model Foundry v13's focus suppression and ordered keybinding consumption.
  class FixtureKeyboard {
    static getKeyboardEventContext(event) {
      return { event, key: event.code, repeat: event.repeat, modifiers: [
        ...(event.ctrlKey || event.metaKey ? ["Control"] : []),
        ...(event.altKey ? ["Alt"] : []), ...(event.shiftKey ? ["Shift"] : [])
      ] };
    }
    static _getMatchingActions(context) {
      return [...game.keybindings.actions.entries()]
        .sort(([, a], [, b]) => a.precedence - b.precedence)
        .filter(([, action]) => (!context.repeat || action.repeat)
          && [...(action.uneditable ?? []), ...(action.editable ?? [])].some(binding =>
            binding.key === context.key && (binding.modifiers ?? []).length === context.modifiers.length
            && (binding.modifiers ?? []).every(modifier => context.modifiers.includes(modifier))))
        .map(([id, action]) => ({ ...action, action: id }));
    }
    process(event, { force = false } = {}) {
      const focused = document.activeElement;
      if (!force && (focused?.matches("input, select, textarea") || focused?.isContentEditable)) return;
      const context = FixtureKeyboard.getKeyboardEventContext(event);
      for (const action of FixtureKeyboard._getMatchingActions(context)) {
        if (action.onDown?.(context)) { event.preventDefault(); event.stopPropagation(); break; }
      }
    }
  }
  game.keyboard = new FixtureKeyboard();
  game.keybindings.register("core", "dismiss", {
    uneditable: [{ key: "Escape" }], precedence: CONST.KEYBINDING_PRECEDENCE.DEFERRED,
    onDown: ({ event }) => {
      if (!event.target) throw new Error("A synthetic event lost its target (Plutonium regression)");
      fixtureState.nativeDismisses = (fixtureState.nativeDismisses || 0) + 1;
      for (const app of Object.values(ui.windows)) app.close({ closeKey: true });
      for (const app of foundry.applications.instances.values()) if (app.hasFrame) app.close({ closeKey: true });
      return true;
    }
  });
  window.addEventListener("keydown", event => game.keyboard.process(event));
  const rows = [
    ["Fireball", "PHB", "2014"], ["Fireball", "PHB 2024", "2024"],
    ["Fire Bolt", "PHB", "2014"], ["Fire Bolt", "PHB", "2024"],
    ["Fire Shield", "TCoE", "2014"], ["Fire Ward", "", ""],
    ['Unsafe <img src=x onerror="window.pwned=true">', '<img src=x onerror="window.pwned=true">', ""],
    ["剑 / Sword", "玩家手册", "2024"]
  ];
  const items = rows.map(([name, book, rules], i) => ({
    name, uuid: `Compendium.fixture.spells.Item.item${i}`, package: "fixture.spells",
    documentType: "Item", subType: i === 7 ? "weapon" : "spell", img: icon,
    system: { source: { book, rules }, level: [3, 3, 0, 0, 4, 2, null, null][i], school: i === 5 ? "abj" : "evo", activation: { type: i === 5 ? "bonus" : "action" }, properties: i === 5 ? ["concentration", "ritual", "vocal"] : ["vocal", "somatic"] },
    async show() { fixtureState.opened.push(name); document.querySelector("#opened").textContent = `Opened: ${name}`; }
  }));
  items.push({ name: "Fire Elemental", uuid: "Actor.test", documentType: "Actor", subType: "npc", img: icon,
    system: { source: { book: "MM 2025" }, details: { cr: 5, type: { value: "elemental" } }, traits: { size: "lg" }, resources: { legact: { max: 0 } } },
    async show() { fixtureState.opened.push(this.name); } });
  for (let i = 0; i < 120; i++) items.push({ ...items[0], name: `Bulk item ${i}`, uuid: `Item.bulk${i}` });
  items.push({ ...items[0], name: "Bulk late ritual", uuid: "Item.late-ritual", system: { source: { book: "TCoE" }, level: 1, school: "div", activation: { type: "minute" }, properties: ["ritual", "vocal", "material"] } });
  items.push({ ...items[0], name: "Mystery spell", uuid: "Item.unknown", system: {} });
  items.push({ ...items[0], name: "宝石法术 Gem Spell", uuid: "Item.costly", system: { source: { book: "Homebrew" }, level: 1, school: "abj", activation: { type: "minute" }, properties: ["material", "ritual"], materials: { cost: 100, consumed: false } } });
  items.push({ ...items[0], name: "测试魔杖 Test Wand", uuid: "Item.wand", subType: "equipment", system: { source: { book: "DMG 2024" }, rarity: "rare", type: { value: "wand" }, properties: ["mgc"], attunement: "required" } });
  items.push({ ...items[0], name: "测试药水 Test Potion", uuid: "Item.potion", subType: "consumable", system: { source: { book: "DMG 2024" }, rarity: "common", type: { value: "potion" }, properties: ["mgc"], attunement: "" } });
  for (const [id, name, cr, size, type, max] of [["rat", "Rat", 0, "tiny", "beast", 0], ["scout", "Scout", 0.25, "med", "humanoid", 0], ["dragon", "Dragon", 20, "grg", "dragon", 3], ["unknown", "Unknown creature", null, null, null, null]]) {
    items.push({ name, uuid: `Actor.${id}`, documentType: "Actor", subType: "npc", img: icon,
      system: { source: { book: "MM 2025" }, details: { cr, type: { value: type } }, traits: { size }, resources: { legact: { max } } },
      async show() { fixtureState.opened.push(this.name); } });
  }
  items.push({ name: "Player character", uuid: "Actor.pc", documentType: "Actor", subType: "character", system: {} });
  if (new URL(location.href).searchParams.has("sources")) {
    const examples = [
      ["Source test — PHB page 153", { book: "PHB", custom: "PHB pg. 153", rules: "2014" }],
      ["Source test — PHB page 150", { book: "PHB", custom: "PHB pg. 150", rules: "2014" }],
      ["Source test — PHB revised", { book: "PHB 2024", page: "232", rules: "2024" }],
      ["Source test — edition conflict", { book: "PHB 2014", rules: "2024", page: "153" }],
      ["Source test — edition unknown", { custom: "PHB pg. 153" }],
      ["Source test — module version", { custom: "2.1.38", rules: "2024" }],
      ["Source test — Tasha long title", { custom: "Tasha’s Cauldron of Everything pg 108" }],
      ["Source test — TCE abbreviation", { book: "TCE" }],
      ["Source test — multi source", { custom: "VGM/MPMM" }],
      ["Source test — addon publication", { custom: "My Test Almanac" }]
    ];
    examples.forEach(([name, source], i) => items.push({ name, uuid: `Item.source${i}`, documentType: "Item", subType: "equipment", img: icon,
      system: { source }, async show() { document.querySelector("#opened").textContent = `Opened UUID: ${this.uuid}`; } }));
    for (const source of ["phb", "xphb"]) items.push({ name: `Source test — external ${source}`, uuid: `@spell[external|${source}]`, documentType: "Item", subType: "spell", source, img: icon,
      async show() { document.querySelector("#opened").textContent = `Opened UUID: ${this.uuid}`; } });
    const provider = document.createElement("button"); provider.textContent = "Register test publication";
    provider.onclick = () => game.modules.get("slow-insert").api.registerPublications("fixture", [{ id: "my-almanac", label: "MTA", title: "My Test Almanac" }]);
    document.querySelector("main").append(provider);
  }
  if (new URL(location.href).searchParams.has("grouping")) {
    const { groupingFixture } = await import("./grouping-fixture.mjs");
    for (const {item} of groupingFixture().rows) {
      item.img=icon;
      item.show=async()=>{fixtureState.opened.push(item.name);document.querySelector("#opened").textContent=`Opened UUID: ${item.uuid}`;};
      items.push(item);
    }
    const stale = document.createElement("button"); stale.textContent="Simulate edited source";
    stale.onclick=()=>{items.find(item=>item.system?.identifier==="example-spell").system.school="evo";Hooks.callAll("updateItem",{});};
    document.querySelector("main").append(stale);
  }
  globalThis.fixtureItems = items;
  game.items = new Map(items.filter(item => item.uuid.startsWith("Item.")).map(item => [item.uuid.split(".")[1], {visible:true}]));
  game.actors = new Map(items.filter(item => item.uuid.startsWith("Actor.")).map(item => [item.uuid.split(".")[1], {visible:true}]));
  globalThis.QuickInsert = {
    hasIndex: true,
    search(query, filter, max) {
      fixtureState.calls.push(query);
      return items.filter(item => item.name.toLowerCase().includes(query.toLowerCase())).map(item => ({ item })).filter(filter).slice(0, max);
    },
    async forceIndex() {
      fixtureState.indexBuilds++;
      await new Promise(resolve => setTimeout(resolve, 200));
      this.hasIndex = true;
      Hooks.callAll("QuickInsert:IndexCompleted");
    }
  };
  document.querySelector("#deny").onclick = () => { fixtureState.denied = !fixtureState.denied; settings.set("quick-insert.gmOnly", fixtureState.denied); };
  document.querySelector("#drop").ondragover = event => event.preventDefault();
  document.querySelector("#drop").ondrop = event => { event.preventDefault(); fixtureState.drop = JSON.parse(event.dataTransfer.getData("text/plain")); event.currentTarget.textContent = JSON.stringify(fixtureState.drop); };
  await import("/truesight/scripts/main.mjs");
  await import("/module/scripts/main.mjs");
  await Hooks.callAll("init");
  await Hooks.callAll("setup");
  mountSidebarFixture();
  if (new URL(location.href).searchParams.has("rules")) {
    const def = definitions.get("slow-insert.rulesDisplay");
    const label = document.createElement("label");
    label.textContent = labels[def.name];
    const select = document.createElement("select");
    for (const [value, key] of Object.entries(def.choices)) select.add(new Option(labels[key], value));
    select.value = game.settings.get("slow-insert", "rulesDisplay");
    select.onchange = () => game.settings.set("slow-insert", "rulesDisplay", select.value);
    label.append(select);
    document.querySelector("main").append(label);
  }
  game.ready = true;
  await Hooks.callAll("ready");
  globalThis.fixtureReady = true;
  document.querySelector("#run-checks").onclick = async event => {
    event.target.disabled = true;
    const report = document.querySelector("#check-report");
    report.textContent = "Running…";
    try {
      const { runBrowserChecks, runLayoutBrowserChecks } = await import("./browser-checks.js");
      const { runFilterBrowserChecks } = await import("./filter-browser-checks.js");
      const checks = [...await runBrowserChecks(), ...await runFilterBrowserChecks(), ...await runLayoutBrowserChecks()];
      if (new URL(location.href).searchParams.has('grouping')) {
        const {runTruesightRefreshChecks} = await import('./truesight-refresh-browser-checks.js');
        checks.push(...await runTruesightRefreshChecks());
      }
      report.textContent = `PASS: ${checks.length} checks\n${checks.join("\n")}`;
    } catch (error) { report.textContent = `FAIL: ${error.stack}`; }
    finally { event.target.disabled = false; }
  };
</script>
</html>
